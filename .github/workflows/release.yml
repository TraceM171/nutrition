name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Test
        run: npm test
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: Compute version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "tag=v${COUNT}" >> "$GITHUB_OUTPUT"
          echo "name=v${COUNT} (${SHORT})" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          files: app/meal-planner-dist.html
          generate_release_notes: true
